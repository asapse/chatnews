[project]
name = "chatnews"
version = "0.1.0"
description = "News aggregator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymongo>=4.16.0",
    "rss-parser>=2.1.1",
    "zenml>=0.93.1",
]


[dependency-groups]
dev = [
    "ipython>=9.4.0",
    "pre-commit>=4.3.0",
    "ruff>=0.12.8",
    "ty>=0.0.14",
]

[tool.ruff]
fix = true
line-length = 88
indent-width = 4
target-version = "py312"

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["main", "ask_ai"]

[tool.ruff.lint.per-file-ignores]
"ask_ai/context/system_prompt.py" = ["E501"]
"ask_ai/tools/date.py" = ["E501"] 
"ask_ai/sql_to_jsonlogic.py" = ["C901"]

[tool.ruff.lint]
select = ["E", "F", "SIM", "B", "UP", "I", "S", "W", "C90"]
fixable = ["E", "F", "SIM", "B", "UP", "I", "S", "W", "C90"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
