[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."

[project]
name = "chatnews"
version = "0.1.0"
description = "News aggregator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.12",
    "justext>=3.0.2",
    "lingua-language-detector>=2.1.1",
    "loguru>=0.7.3",
    "pydantic>=2.11.9",
    "pymongo>=4.16.0",
    "requests>=2.32.5",
    "rss-parser>=2.1.1",
    "tqdm>=4.67.1",
    "typing-extensions>=4.15.0",
    "zenml[local,server]>=0.93.1",
]


[dependency-groups]
dev = [
    "ipython>=9.4.0",
    "pre-commit>=4.3.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.12.8",
    "ty>=0.0.14",
]

[tool.ruff]
fix = true
line-length = 88
indent-width = 4
target-version = "py312"

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["main", "app", "pipelines", "core"]

[tool.ruff.lint]
select = ["E", "F", "SIM", "B", "UP", "I", "S", "W", "C90"]
fixable = ["E", "F", "SIM", "B", "UP", "I", "S", "W", "C90"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


[tool.pytest]
minversion = "9.0"
addopts = [
    "-v", 
    "--showlocals", 
    "--cov=chatnews/",
    "--cov-report=term-missing",
    "--junitxml=./test-reports/report.xml"
]
